# ============================================================
# Codemagic — Build iOS Glow Up (Capacitor) → TestFlight
# Bundle ID : app.glowupskin
# Aucun secret ici : la clé API App Store Connect et la signature
# sont gérées dans l'interface Codemagic (Integrations), jamais dans le repo.
# ============================================================
workflows:
  ios-testflight:
    name: Glow Up · iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Nom EXACT de la clé API App Store Connect enregistrée dans Codemagic
      # (Teams → Integrations → App Store Connect).
      app_store_connect: "Codemagic Glow Up"

    environment:
      ios_signing:
        distribution_type: app_store          # signature de distribution (TestFlight/App Store)
        bundle_identifier: app.glowupskin     # doit exister dans Apple Developer
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Installer les dépendances npm
        script: npm install

      - name: Générer le dossier web (www/)
        script: npm run build:web

      - name: Créer / synchroniser le projet iOS (ne recrée que si absent)
        script: |
          if [ -d "ios" ]; then
            npx cap sync ios
          else
            npx cap add ios
            npx cap sync ios
          fi

      - name: Générer icônes + splash (depuis resources/)
        script: |
          set -e
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#F5ECE0' \
            --splashBackgroundColor '#F5ECE0'
          npx cap sync ios
          # VÉRIFICATION : l'icône doit exister, sinon l'app sort SANS logo → on bloque le build
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          echo "--- Vérification de l'icône générée ---"
          if [ ! -d "$ICONSET" ]; then echo "MANQUANT: $ICONSET"; exit 1; fi
          PNG_COUNT=$(ls "$ICONSET"/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "Icônes PNG générées : $PNG_COUNT"
          if [ "$PNG_COUNT" -lt 1 ]; then echo "AUCUNE icône PNG générée"; exit 1; fi
          ls -la "$ICONSET"

      - name: Autorisations caméra / photos (Info.plist, FR) + vérification
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"
          if [ ! -f "$PLIST" ]; then echo "Info.plist introuvable ($PLIST)"; exit 1; fi
          # plutil -replace : robuste aux apostrophes (PlistBuddy « Add » cassait sur « l'appareil »).
          # -replace crée la clé si absente, ou la remplace si présente.
          set_key () {
            plutil -replace "$1" -string "$2" "$PLIST"
          }
          set_key NSCameraUsageDescription "Glow Up utilise l'appareil photo pour analyser votre peau et personnaliser votre routine."
          set_key NSPhotoLibraryUsageDescription "Glow Up accède à vos photos pour vous permettre de sélectionner une photo pour votre analyse."
          set_key NSPhotoLibraryAddUsageDescription "Glow Up peut enregistrer une photo prise dans l'application si vous le choisissez."
          # Conformité chiffrement : l'app n'utilise que du HTTPS standard → "non".
          # Évite que chaque build reste bloqué en "Missing Compliance" dans TestFlight.
          plutil -replace ITSAppUsesNonExemptEncryption -bool false "$PLIST"
          # VÉRIFICATION : le build échoue si une clé est absente (évite un nouveau crash caméra)
          echo "--- Vérification des autorisations Info.plist ---"
          for K in NSCameraUsageDescription NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription; do
            V=$(/usr/libexec/PlistBuddy -c "Print :$K" "$PLIST" 2>/dev/null || true)
            if [ -z "$V" ]; then echo "MANQUANTE: $K"; exit 1; fi
            echo "OK $K = $V"
          done

      - name: Numéro de build unique et croissant (accepté par TestFlight)
        script: |
          # Basé sur la date/heure → toujours supérieur au build précédent, jamais de collision.
          cd "$CM_BUILD_DIR/ios/App"
          BN="$(date +%Y%m%d%H%M)"
          agvtool new-version -all "$BN"
          echo "CFBundleVersion → $BN"

      - name: Installer les pods
        script: |
          cd ios/App && pod install

      - name: Configurer la signature (profils Codemagic)
        script: xcode-project use-profiles

      - name: Compiler l'IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: VÉRIFICATION FINALE — l'autorisation caméra est bien dans l'IPA
        script: |
          set -e
          IPA=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then echo "IPA introuvable"; exit 1; fi
          echo "IPA : $IPA"
          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          APP_PLIST=$(ls "$WORK"/Payload/*.app/Info.plist 2>/dev/null | head -1)
          if [ -z "$APP_PLIST" ]; then echo "Info.plist introuvable dans l'IPA"; exit 1; fi
          echo "--- Vérification des autorisations DANS l'app compilée ---"
          for K in NSCameraUsageDescription NSPhotoLibraryUsageDescription; do
            V=$(/usr/libexec/PlistBuddy -c "Print :$K" "$APP_PLIST" 2>/dev/null || true)
            if [ -z "$V" ]; then echo "ABSENTE de l'IPA : $K"; exit 1; fi
            echo "OK (dans l'IPA) $K = $V"
          done

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false     # upload seul (test interne) — pas de soumission bêta externe
        submit_to_app_store: false      # PAS de soumission auto à l'App Store

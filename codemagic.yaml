# ============================================================
# Codemagic — Build iOS Glow Up (Capacitor) → TestFlight
# Bundle ID : app.glowupskin
# Aucun secret ici : la clé API App Store Connect et la signature
# sont gérées dans l'interface Codemagic (Integrations), jamais dans le repo.
# ============================================================
workflows:
  ios-testflight:
    name: Glow Up · iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Nom EXACT de la clé API App Store Connect enregistrée dans Codemagic
      # (Teams → Integrations → App Store Connect).
      app_store_connect: "Codemagic Glow Up"

    environment:
      ios_signing:
        distribution_type: app_store          # signature de distribution (TestFlight/App Store)
        bundle_identifier: app.glowupskin     # doit exister dans Apple Developer
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Installer les dépendances npm
        script: npm install

      - name: Générer le dossier web (www/)
        script: npm run build:web

      - name: Créer / synchroniser le projet iOS (ne recrée que si absent)
        script: |
          if [ -d "ios" ]; then
            npx cap sync ios
          else
            npx cap add ios
            npx cap sync ios
          fi

      - name: Générer icônes + splash (depuis resources/)
        script: |
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#F5ECE0' \
            --splashBackgroundColor '#F5ECE0' || true
          npx cap sync ios

      - name: Autorisations caméra / photos (Info.plist, FR) + vérification
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"
          if [ ! -f "$PLIST" ]; then echo "Info.plist introuvable ($PLIST)"; exit 1; fi
          # Delete-then-Add : garantit une écriture propre de la clé (string)
          add_key () {
            /usr/libexec/PlistBuddy -c "Delete :$1" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"
          }
          add_key NSCameraUsageDescription "Glow Up utilise l'appareil photo pour analyser votre peau et personnaliser votre routine."
          add_key NSPhotoLibraryUsageDescription "Glow Up accède à vos photos pour vous permettre de sélectionner une photo pour votre analyse."
          add_key NSPhotoLibraryAddUsageDescription "Glow Up peut enregistrer une photo prise dans l'application si vous le choisissez."
          # VÉRIFICATION : le build échoue si une clé est absente (évite un nouveau crash caméra)
          echo "--- Vérification des autorisations Info.plist ---"
          for K in NSCameraUsageDescription NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription; do
            V=$(/usr/libexec/PlistBuddy -c "Print :$K" "$PLIST" 2>/dev/null || true)
            if [ -z "$V" ]; then echo "MANQUANTE: $K"; exit 1; fi
            echo "OK $K = $V"
          done

      - name: Numéro de build unique et croissant (accepté par TestFlight)
        script: |
          # Basé sur la date/heure → toujours supérieur au build précédent, jamais de collision.
          cd "$CM_BUILD_DIR/ios/App"
          BN="$(date +%Y%m%d%H%M)"
          agvtool new-version -all "$BN"
          echo "CFBundleVersion → $BN"

      - name: Installer les pods
        script: |
          cd ios/App && pod install

      - name: Configurer la signature (profils Codemagic)
        script: xcode-project use-profiles

      - name: Compiler l'IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false     # upload seul (test interne) — pas de soumission bêta externe
        submit_to_app_store: false      # PAS de soumission auto à l'App Store
